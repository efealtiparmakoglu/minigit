[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigit"
version = "1.0.0"
description = "A from-scratch content-addressed mini version control system (blob/tree/commit objects, branches, log)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
minigit = "minigit:main"
